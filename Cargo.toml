# The ENGINE of the pipeline stack: memoization, invalidation, scheduling and
# the two drivers, GENERIC over every payload type - it enforces
# `libpipelinedata`'s traits as seams, never a copy of its own.
#
# THE DEPENDENCY LIST BELOW IS A PROOF, NOT A CONVENIENCE. The engine may
# never learn a consumer's types: no IR crate, no app crate, in dependencies
# or dev-dependencies, ever (DESIGN.md, "The engine stays generic").
# `tests/engine_stays_generic.rs` reads this file - and, following its path
# dependencies, every manifest under it - and fails if a crate outside the
# stack's own closed allowlist appears ANYWHERE in the tree. The check is
# transitive because nothing in the stack reaches outside the allowlist at any
# step, so the stronger rule is true for free: a rule that holds transitively
# cannot be evaded by routing an edge through a sibling.
[package]
name = "libpipeline"
version = "0.1.0"
edition = "2024"
description = "An incremental pipeline engine: memoized, poll-driven stages under a frame driver and a blocking driver, generic over every payload type"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
libeffects = { path = "../libeffects" }
libpipelinedata = { path = "../libpipelinedata" }
