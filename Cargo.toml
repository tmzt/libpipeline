# The ENGINE of the pipeline stack (PIPELINE_PLAN.md §6): memoization,
# invalidation and scheduling, GENERIC over the expression types — it enforces
# `libpipelinedata`'s traits as seams, never a copy of its own, and §5's two
# drivers live here.
#
# THE DEPENDENCY LIST BELOW IS A PROOF, NOT A CONVENIENCE. Per
# PIPELINE_PLAN.md:563-568 the engine may never learn an IR: no `libtsx`, no
# Highbay crate, in dependencies or dev-dependencies, ever. Rust makes that
# check sufficient rather than merely indicative — a crate reachable only
# transitively cannot be named in a `use`, so an engine that wanted to match on
# a real IR would have to add the edge here, in the open.
# `tests/engine_stays_generic.rs` reads this file and fails if one appears.
[package]
name = "libpipeline"
version = "0.1.0"
edition = "2024"
description = "The pipeline engine: memoization and the two drivers of PIPELINE_PLAN.md §5, generic over every expression type"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
libeffects = { path = "../libeffects" }
libpipelinedata = { path = "../libpipelinedata" }
